[pytest]
testpaths = tests

# Default run is hermetic: no network, no real database.
# Integration tests are opt-in via AURA_RUN_INTEGRATION=1.
addopts = -m "not integration"

markers =
    integration: touches the network or external services (opt-in)

# pytest-asyncio is installed but this suite has no async tests; the
# plugin warns on every run because the value is unset, and a warning
# that is always there is a warning nobody reads. `function` is the
# default the plugin has announced for its next major version, so
# pinning it silences the notice and makes the eventual upgrade a
# no-op. Nothing in the suite is affected today - there are no async
# fixtures for it to scope.
asyncio_default_fixture_loop_scope = function
