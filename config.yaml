app:
  name: Aura
  version: 0.2.0

llm:
  provider: gemini
  model: gemini-3.6-flash
  fallback_provider: openrouter
  fallback_model: openrouter/free
  timeout: 120
  max_output_tokens: 768

memory:
  history_limit: 10

  profile: true
  recall: false
  max_facts: 5
  max_recalled: 2

voice:
  tts:
    enabled: false

  stt:
    enabled: false

vision:
  enabled: true
  capture_screen: false
  model: gemini-3.6-flash
  fallback_model: openrouter/free
  max_pixels: 1500000
  jpeg_quality: 75

avatar:
  enabled: false

tools:
  enabled: false
  allowed: []

  auto_approve:
    - safe

  allowed_paths: []
  applications: []

server:
  screen:
    enabled: true
    min_interval: 8.0

logging:
  level: INFO
