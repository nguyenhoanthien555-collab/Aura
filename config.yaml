app:
  name: Aura
  version: 0.2.0

llm:
  provider: gemini
  model: gemini-3.6-flash
  timeout: 120

memory:
  history_limit: 20

  profile: true
  recall: false
  max_facts: 8
  max_recalled: 3

voice:
  tts:
    enabled: false

  stt:
    enabled: false

vision:
  enabled: false
  capture_screen: false

avatar:
  enabled: false

tools:
  enabled: false
  allowed: []

  auto_approve:
    - safe

  allowed_paths: []
  applications: []

logging:
  level: INFO