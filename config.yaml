app:
  name: Aura
  version: 0.2.0

llm:
  provider: ollama
  model: qwen2.5vl:7b
  host: http://127.0.0.1:11434
  timeout: 120

memory:
  history_limit: 20

  # Long-term memory
  profile: true
  recall: false
  max_facts: 8
  max_recalled: 3

voice:
  tts:
    enabled: true

    # Edge TTS gives Aura her actual neural voice.
    provider: edge

    # Female, warm, expressive.
    voice: zh-CN-XiaoxiaoNeural

    # Slightly quicker than neutral.
    rate: "-5%"

    # Slightly brighter while remaining natural.
    pitch: "-20Hz"

    # Normal volume.
    volume: "+20%"

    # Network synthesis timeout.
    timeout: 60.0

    # Maximum playback duration.
    playback_timeout: 120.0

    playback: true

  stt:
    enabled: true
    provider: whisper
    model: base
    language: ""
    record_seconds: 5.0
    wake_word: ""

  microphone:
    sample_rate: 16000
    channels: 1
    device: null

vision:
  enabled: true
  capture_screen: true

  # mss monitor index: 1 = primary display, 2 = second, 0 = all combined.
  monitor: 1

  min_interval: 2.0

  # Local vision model that reads captured frames.
  model: qwen2.5vl:7b
  host: http://127.0.0.1:11434
  timeout: 120.0

  # Set to a path (e.g. debug_screen.png) to save the exact frame sent to
  # the model. Off by default: it writes a screenshot to disk.
  debug_frame: ""

avatar:
  enabled: true
  size: 160
  scale: 1.0
  opacity: 0.95
  position: null
  sprites_dir: ""

tools:
  # Two locks must be opened:
  # 1. Enable the tool system
  # 2. Explicitly allow individual tools
  enabled: false

  allowed: []

  # Safe tools can run automatically.
  # Everything else requires approval.
  auto_approve:
    - safe

  allowed_paths: []
  applications: {}

logging:
  level: INFO