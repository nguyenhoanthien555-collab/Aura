name: "AURA"
version: "0.9.0"
runtime: "Python 3.11+"
framework: "FastAPI / AsyncIO"
venv_path: "D:\\AURA\\.venv"
test_runner: "D:\\AURA\\.venv\\Scripts\\python.exe -m pytest -q"
local_llm_endpoint: "http://127.0.0.1:8080/v1"
model: "gpt-oss-20b-MXFP4"
context_window: 16384
subsystems:
  - name: "core"
    path: "D:/AURA/core"
    description: "Core runtime, agent loop, pipeline execution, task graph, capability registries"
  - name: "server"
    path: "D:/AURA/server"
    description: "FastAPI REST/WebSocket server, settings APIs, health endpoints, provider routes"
  - name: "tools"
    path: "D:/AURA/tools"
    description: "Built-in tools, tool providers, executor, timeout wrappers, schema validation"
  - name: "voice"
    path: "D:/AURA/voice"
    description: "STT, TTS, audio streaming pipeline"
  - name: "vision"
    path: "D:/AURA/vision"
    description: "Screen capture, remote vision, Ollama processor"
  - name: "companion_android"
    path: "D:/AURA/android"
    description: "Android companion integration, UI tree parser, ADB actions"
  - name: "memory"
    path: "D:/AURA/memory"
    description: "Session memory, persistent sqlite store"
